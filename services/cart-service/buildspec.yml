version: 0.2

env:
  variables:
    AWS_DEFAULT_REGION: "us-east-2"
    AWS_ACCOUNT_ID: "431445718171"
    IMAGE_REPO_NAME: "ecommerce/order-service"
    APP_VERSION: "v4.0.0"
  exported-variables:
    - REPOSITORY_URI
    - IMAGE_TAG

phases:
  pre_build:
    commands:
      - echo Logging in to Amazon ECR...
      - aws ecr get-login-password --region $AWS_DEFAULT_REGION | docker login --username AWS --password-stdin $AWS_ACCOUNT_ID.dkr.ecr.$AWS_DEFAULT_REGION.amazonaws.com
      - SHORT_HASH=$(echo ${CODEBUILD_RESOLVED_COMMIT_HASH:-$CODEBUILD_BUILD_NUMBER} | cut -c 1-7)
      - export REPOSITORY_URI="$AWS_ACCOUNT_ID.dkr.ecr.$AWS_DEFAULT_REGION.amazonaws.com/$IMAGE_REPO_NAME"
      - export IMAGE_TAG="${APP_VERSION}-${SHORT_HASH}"
      - echo Target tag is $IMAGE_TAG

  build:
    commands:
      - echo Build started on $(date)
      - docker build -t $REPOSITORY_URI:$IMAGE_TAG -t $REPOSITORY_URI:latest ./services/order-service

  post_build:
    commands:
      - echo Build completed on $(date)
      - echo Pushing tagged images to ECR...
      - docker push $REPOSITORY_URI:$IMAGE_TAG
      - docker push $REPOSITORY_URI:latest
      - |
        printf '[{"name":"%s","imageUri":"%s"}]' "$IMAGE_REPO_NAME" "$REPOSITORY_URI:$IMAGE_TAG" > imagedefinitions.json
